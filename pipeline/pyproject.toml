[project]
name = "firecal"
version = "0.1.0"
description = "FireCal data pipeline: FIRMS ingest, cleaning, gridding and MODIS-VIIRS harmonization"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=17",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.7",
]

[project.scripts]
firecal = "firecal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firecal"]
