repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: web-lint
        name: eslint (web)
        entry: pnpm --dir web lint
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: web-prettier
        name: prettier (web)
        entry: pnpm --dir web format:check
        language: system
        files: ^web/
        pass_filenames: false
