[project]
name = "firecal-api"
version = "0.1.0"
description = "FireCal read-only API over the harmonized Parquet cube"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "duckdb>=2.0",
    "cachetools>=5.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
