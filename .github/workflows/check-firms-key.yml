name: Check FIRMS MAP_KEY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Verify secret against FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: uv run firecal check-key
