name: Deploy

# Deploys on every push to main (T-38). Each target is skipped cleanly until its
# secrets/variables are configured, so forks and fresh clones never fail here.
#
#   API (container)   -> GHCR image always; Fly.io when FLY_API_TOKEN is set
#   Web (static)      -> Cloudflare Pages when CLOUDFLARE_API_TOKEN is set
#
# Repository variables: API_BASE_URL (public API URL used by the web build),
# CF_PAGES_PROJECT (Cloudflare Pages project), CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API container
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/firecal-api:latest
            ghcr.io/${{ github.repository_owner }}/firecal-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --image ghcr.io/${{ github.repository_owner }}/firecal-api:${{ github.sha }}
      - name: Smoke test the public API
        if: env.FLY_API_TOKEN != '' && vars.API_BASE_URL != ''
        run: |
          curl -fsS "${{ vars.API_BASE_URL }}/health"
          curl -fsS "${{ vars.API_BASE_URL }}/meta" | head -c 400
      - name: Fly.io not configured
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN not set; image pushed to GHCR, Fly.io deploy skipped."

  web:
    name: Web (static)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
          VITE_BASEMAP_STYLE: https://tiles.openfreemap.org/styles/dark
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'firecal' }} --branch=main
      - name: Cloudflare Pages not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; web build checked, deploy skipped."
