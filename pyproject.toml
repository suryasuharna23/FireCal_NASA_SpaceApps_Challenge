[project]
name = "firecal-workspace"
version = "0.1.0"
description = "FireCal: harmonized MODIS-VIIRS fire activity calendar (NASA Space Apps)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["firecal", "firecal-api"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipeline", "api"]

[tool.uv.sources]
firecal = { workspace = true }
firecal-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Typer options and FastAPI dependencies are declared as call defaults by design.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["firecal", "app"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]
addopts = "-ra --import-mode=importlib"
