# Fly.io app for the FireCal API (T-38). Deploy with: flyctl deploy --remote-only
# FRD 7.5: 2 vCPU / 2 GB, at least one instance running during the demo.
app = "firecal-api"
primary_region = "sin"

[build]
  dockerfile = "api/Dockerfile"

[env]
  # Processed Parquet in Cloudflare R2 (S3 API); credentials come from `fly secrets`.
  DATA_URI = "s3://firecal-data/processed"
  CORS_ORIGINS = "https://firecal.pages.dev"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
